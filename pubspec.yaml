name: nichesphere
description: Hyperlocal micro-community event discovery
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State & Navigation
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  go_router: ^12.1.3

  # Firebase
  firebase_core: ^4.8.0
  firebase_auth: ^6.5.0
  cloud_firestore: ^6.4.0
  firebase_storage: ^13.4.0
  firebase_messaging: ^16.2.1
  firebase_analytics: ^12.4.0
  firebase_crashlytics: ^5.2.1
  firebase_performance: ^0.11.4

  # UI & Animation
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  google_fonts: ^8.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_dotenv: ^5.1.0

  # Maps & Location
  google_maps_flutter: ^2.9.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  workmanager: ^0.9.0+3

  # Storage & Local DB
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.1.0
  path_provider: ^2.1.5

  # Networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Image
  image_picker: ^1.1.2
  image_cropper: ^12.2.1
  flutter_image_compress: ^2.3.0

  # Utilities
  intl: ^0.20.2
  timezone: ^0.10.0
  timeago: ^3.7.0
  uuid: ^4.4.2
  permission_handler: ^12.0.1
  url_launcher: ^6.3.0
  share_plus: ^12.0.2
  fpdart: ^1.1.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Auth (Social)
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.4

  # Notifications
  flutter_local_notifications: ^20.1.0

  # Forms
  reactive_forms: ^18.2.2

  # Other
  package_info_plus: ^9.0.1
  connectivity_plus: ^7.1.1
  flutter_svg: ^2.0.10+1
  dotted_border: ^3.1.0
  smooth_page_indicator: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.0
  freezed: ^2.4.8
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/animations/
    - assets/images/
    - assets/icons/
    - assets/map_styles/
