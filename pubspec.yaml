name: nichesphere
description: Hyperlocal discovery for micro-communities (pastel glassmorphism, animated, interest-first)
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_riverpod: ^2.4.9
  go_router: ^12.1.3
  google_maps_flutter: ^2.5.3
  flutter_animate: ^4.5.0
  lottie: ^3.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cloud_firestore: ^4.14.0
  firebase_auth: ^4.16.0
  firebase_storage: ^11.6.0
  firebase_core: ^2.24.2
  google_fonts: ^6.1.0
  geolocator: ^10.1.0
  permission_handler: ^11.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
